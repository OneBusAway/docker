name: Test

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege by default: these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  renderer:
    name: Template renderer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Run renderer tests
        working-directory: oba/config/template_renderer
        run: go test ./...

  bundle_script:
    name: build_bundle.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Guard - oba and bundler scripts identical
        run: diff oba/build_bundle.sh bundler/build_bundle.sh

      # The two images are separate build contexts, so the gtfstidy pin lives in
      # both Dockerfiles and Dependabot doesn't track it. Catch drift here.
      - name: Guard - gtfstidy pinned to the same version in both images
        # grep runs outside a process substitution so a missing pin fails the
        # step instead of comparing two empty outputs and passing.
        run: |
          oba_pin="$(grep '^ARG GTFSTIDY_VERSION=' oba/Dockerfile)"
          bundler_pin="$(grep '^ARG GTFSTIDY_VERSION=' bundler/Dockerfile)"
          [ "$oba_pin" = "$bundler_pin" ] || { echo "oba: $oba_pin"; echo "bundler: $bundler_pin"; exit 1; }

      - name: Run script tests
        run: bash bin/build_bundle_test.sh

  bundle_inputs_integration:
    name: Bundle inputs integration (real builder)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build oba image
        run: |
          docker buildx build \
            --load \
            -t oba-image:latest \
            ./oba

      - name: Run integration test
        timeout-minutes: 20
        run: |
          chmod +x bin/bundle_inputs_integration_test.sh bin/testdata/build_bundle/make_fixtures.sh
          bash bin/bundle_inputs_integration_test.sh

  image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build bundler image
        run: |
          docker buildx build \
            --load \
            -t bundler-image:latest \
            ./bundler

      - name: Build oba image
        run: |
            docker buildx build \
              --load \
              -t oba-image:latest \
              ./oba

  services:
    name: Services with Bundler
    runs-on: ubuntu-latest
    # Build against a small committed GTFS fixture served on the compose network
    # instead of the live Unitrans feed, so this job is deterministic. See
    # docker-compose.ci.yml and bin/testdata/services/make_services_fixture.sh.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build bundle
        run: |
          docker compose up oba_bundler

      - name: Docker Compose up
        run: |
          docker compose up -d

      - name: Wait for services to be up
        run: sleep 30

      - name: Test the services
        timeout-minutes: 10
        run: |
          chmod +x ./bin/validate.sh
          ./bin/validate.sh

      - name: Docker Compose down
        if: always()
        run: docker compose down

  services_standalone:
    name: Services standalone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Docker Compose up
        run: |
          docker compose -f docker-compose.standalone.yml up -d

      - name: Wait for services to be up
        # leave time to download and process the GTFS data
        run: sleep 60

      - name: Test the services
        timeout-minutes: 10
        run: |
          chmod +x ./bin/validate.sh
          ./bin/validate.sh

      # - name: Breakpoint if tests failed
      #   if: failure()
      #   uses: namespacelabs/breakpoint-action@v0
      #   with:
      #     duration: 30m
      #     authorized-users: aaronbrethorst

      - name: Docker Compose down
        if: always()
        run: docker compose down