# Production-oriented compose file.
#
# Secrets are NOT defaulted: set MYSQL_ROOT_PASSWORD and MYSQL_PASSWORD in the
# environment or an untracked .env file next to this one, e.g.
#
#   MYSQL_ROOT_PASSWORD=$(openssl rand -base64 32)
#   MYSQL_PASSWORD=$(openssl rand -base64 32)
#
# Compose refuses to start until both are set.
#
# Upgrading a deployment that already has a mysql-data volume? MySQL only reads
# these variables when it initializes an empty data directory, so the database
# keeps its old passwords and oba_app will fail with "Access denied" once
# JDBC_PASSWORD changes. Rotate them in the running database first:
#
#   ALTER USER 'oba_user'@'%' IDENTIFIED BY '<MYSQL_PASSWORD>';
#   ALTER USER 'root'@'%' IDENTIFIED BY '<MYSQL_ROOT_PASSWORD>';
#   ALTER USER 'root'@'localhost' IDENTIFIED BY '<MYSQL_ROOT_PASSWORD>';

services:
  oba_bundler:
    build:
      context: ./bundler
    volumes:
      - ./bundle:/bundle
    environment:
      - GTFS_URL

  oba_database:
    image: mysql:8.4
    container_name: oba_database
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD to a strong, unique value}
      MYSQL_DATABASE: oba_database
      MYSQL_USER: oba_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to a strong, unique value}
    # No host port mapping: oba_app reaches the database over the compose
    # network. Publishing 3306 would expose the database to the internet.
    volumes:
      - type: volume
        source: mysql-data
        target: /var/lib/mysql
    restart: always

  oba_app:
    image: opentransitsoftwarefoundation/onebusaway-api-webapp:${OBA_VERSION:-latest}
    container_name: oba_app
    depends_on:
      - oba_database
    build:
      context: ./oba
    environment:
      - JDBC_URL=jdbc:mysql://oba_database:3306/oba_database
      - JDBC_DRIVER=com.mysql.cj.jdbc.Driver
      - JDBC_USER=oba_user
      - JDBC_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD to a strong, unique value}
      # Leave TEST_API_KEY unset in production.
      - TEST_API_KEY
      - TZ
      - VEHICLE_POSITIONS_URL
      - TRIP_UPDATES_URL
      - ALERTS_URL
      - REFRESH_INTERVAL=30
      - AGENCY_ID

    volumes:
      # Share the host"s `bundle` directory
      # with the filesystem of the OBA service.
      - ./bundle:/bundle
    ports:
      # Access the webapp on your host machine at a path like
      # http://localhost:8080/onebusaway-api-webapp/api/where/agency/${YOUR_AGENCY}.json?key=TEST
      - "8080:8080"
      # JMX exporter is unauthenticated: loopback only. Scrape it from the host
      # or attach Prometheus to this compose network instead of opening it up.
      - "127.0.0.1:1234:1234"
    security_opt:
      - no-new-privileges:true
    # restart: always
    labels:
      caddy: "${DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8080}}"

volumes:
  mysql-data:
  caddy-data: {}
